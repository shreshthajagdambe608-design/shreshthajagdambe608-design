<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8edcff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b9a7ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8edcff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#beam)" stroke-width="1.5">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/>
  </line>
  <circle cy="12" r="2.6" fill="#d8c8ff">
    <animate attributeName="cx" values="-20;1220" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
