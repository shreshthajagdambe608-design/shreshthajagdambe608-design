<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40">
  <defs>
    <linearGradient id="panelBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5f5a57" stop-opacity="0.28"/>
      <stop offset="34%" stop-color="#8f8479" stop-opacity="0.34"/>
      <stop offset="68%" stop-color="#4b5566" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2f343d" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="panelBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c6bdb2" stop-opacity="0"/>
      <stop offset="22%" stop-color="#c6bdb2" stop-opacity="0.48"/>
      <stop offset="50%" stop-color="#e0d7cf" stop-opacity="0.88"/>
      <stop offset="72%" stop-color="#9ca8ba" stop-opacity="0.52"/>
      <stop offset="88%" stop-color="#b88d93" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#b88d93" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6cdc3" stop-opacity="0"/>
      <stop offset="70%" stop-color="#d6cdc3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f1e9e1" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-260%" width="220%" height="620%">
      <feGaussianBlur stdDeviation="3" result="blurGlow"/>
      <feMerge>
        <feMergeNode in="blurGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="40" fill="url(#panelBase)" rx="8"/>
  <line x1="24" y1="20" x2="1176" y2="20" stroke="url(#panelBeam)" stroke-width="1.9" opacity="0.92" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="5.2s" repeatCount="indefinite"/>
  </line>
  <line x1="90" y1="20" x2="1110" y2="20" stroke="url(#panelBeam)" stroke-width="4.2" opacity="0.22" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.16;0.32;0.16" dur="6.4s" repeatCount="indefinite"/>
  </line>

  <g transform="translate(600 20)">
    <circle r="6.5" fill="none" stroke="#a9b3c3" stroke-width="1" opacity="0.34">
      <animate attributeName="r" values="5.3;8;5.3" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.44;0.16;0.44" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.6" fill="#343945"/>
    <circle r="2.2" fill="none" stroke="#dccfc3" stroke-width="0.9"/>
  </g>

  <g filter="url(#softGlow)">
    <animateMotion dur="8.4s" repeatCount="indefinite" path="M -40 20 L 1240 20"/>
    <line x1="-26" y1="0" x2="0" y2="0" stroke="url(#pulseTrail)" stroke-width="1.8" opacity="0.76"/>
    <circle cx="0" cy="0" r="1.9" fill="#e7ddd2"/>
  </g>
</svg>
