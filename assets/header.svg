      <stop offset="40%" stop-color="#fff1d6" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#db5e14" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#591803" stop-opacity="0"/>
    </linearGradient>

   
    <linearGradient id="diskBeamGrad" x1="-800" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#471402" stop-opacity="0"/>
      <stop offset="22%" stop-color="#b8450a" stop-opacity="0.45"/>
      <stop offset="42%" stop-color="#f89523" stop-opacity="0.85"/>
      <stop offset="58%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#ffa834" stop-opacity="0.92"/>
      <stop offset="88%" stop-color="#ba450b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#471402" stop-opacity="0"/>
    </linearGradient>

    
    <linearGradient id="outerDustApron" x1="-920" y1="60" x2="300" y2="-20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140401" stop-opacity="0"/>
      <stop offset="18%" stop-color="#4a1705" stop-opacity="0.4"/>
      <stop offset="42%" stop-color="#ad440a" stop-opacity="0.7"/>
      <stop offset="68%" stop-color="#f89a2a" stop-opacity="0.85"/>
      <stop offset="86%" stop-color="#ffdc8f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

   
    <linearGradient id="telemetryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca834" stop-opacity="0"/>
      <stop offset="10%" stop-color="#fca834" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="90%" stop-color="#fca834" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fca834" stop-opacity="0"/>
    </linearGradient>

  
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

   
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="bigBlur"/>
      <feGaussianBlur stdDeviation="4" result="midBlur"/>
      <feMerge>
        <feMergeNode in="bigBlur"/>
        <feMergeNode in="midBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

   
    <filter id="textDrop" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>


  <rect width="1200" height="280" fill="url(#spaceVoid)"/>
