    <circle cx="140" cy="195" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="215" cy="68" r="0.7" opacity="0.3"/><circle cx="280" cy="225" r="1.3" opacity="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="38" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.9s" repeatCount="indefinite"/></circle><circle cx="430" cy="248" r="0.7" opacity="0.4"/>
    <circle cx="510" cy="28" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.6s" repeatCount="indefinite"/></circle><circle cx="690" cy="22" r="1.0" opacity="0.5"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="775" cy="254" r="0.8" opacity="0.4"/><circle cx="850" cy="48" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="935" cy="210" r="0.7" opacity="0.3"/>
    <circle cx="1015" cy="72" r="1.4" opacity="0.8"><animate attributeName="opacity" values="1;0.3;1" dur="4.7s" repeatCount="indefinite"/></circle><circle cx="1090" cy="188" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1165" cy="55" r="1.1" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="5.3s" repeatCount="indefinite"/></circle><circle cx="180" cy="115" r="1.2" fill="#f3c759"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="485" cy="78" r="0.9" fill="#c79f5e"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/></circle><circle cx="730" cy="62" r="1.0" fill="#f3c759"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1045" cy="135" r="1.1" fill="#c79f5e"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.1s" repeatCount="indefinite"/></circle>
  </g></g>
  <g id="gargantua" transform="translate(600, 155)">
    <ellipse cx="0" cy="0" rx="280" ry="40" fill="url(#dopplerAccretion)" opacity="0.22" filter="url(#coronaGlow)"/>
    <g id="upper-lensing-arch"><path d="M -175 0 C -175 -105, 175 -105, 175 0" fill="none" stroke="url(#upperHaloGrad)" stroke-width="26" opacity="0.35" filter="url(#coronaGlow)"/><path d="M -160 0 C -160 -95, 160 -95, 160 0" fill="none" stroke="url(#upperHaloGrad)" stroke-width="12" opacity="0.80" filter="url(#plasmaGlow)"><animate attributeName="opacity" values="0.75;0.92;0.75" dur="6s" repeatCount="indefinite"/></path><path d="M -145 0 C -145 -85, 145 -85, 145 0" fill="none" stroke="url(#hotCoreGrad)" stroke-width="4.5" opacity="0.95" filter="url(#photonShimmer)"/><path d="M -132 0 C -132 -76, 132 -76, 132 0" fill="none" stroke="#fffdf7" stroke-width="1.6" opacity="0.9"/></g>
    <g id="lower-lensing-arch"><path d="M -155 0 C -155 80, 155 80, 155 0" fill="none" stroke="url(#lowerHaloGrad)" stroke-width="18" opacity="0.30" filter="url(#plasmaGlow)"/><path d="M -140 0 C -140 70, 140 70, 140 0" fill="none" stroke="url(#lowerHaloGrad)" stroke-width="6" opacity="0.70" filter="url(#plasmaGlow)"/><path d="M -126 0 C -126 62, 126 62, 126 0" fill="none" stroke="#f3c759" stroke-width="1.8" opacity="0.8" filter="url(#photonShimmer)"/></g>
    <circle cx="0" cy="0" r="58" fill="#010204"/>
    <circle cx="0" cy="0" r="59.5" fill="none" stroke="#fff7e8" stroke-width="2.2" opacity="0.95" filter="url(#photonShimmer)"><animate attributeName="opacity" values="0.8;1;0.8" dur="4.2s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="2.0;2.5;2.0" dur="4.2s" repeatCount="indefinite"/></circle><circle cx="0" cy="0" r="62" fill="none" stroke="#f3c759" stroke-width="1.2" opacity="0.6"><animate attributeName="opacity" values="0.4;0.75;0.4" dur="5.5s" repeatCount="indefinite"/></circle>
    <g id="front-accretion-disk"><ellipse cx="-15" cy="0" rx="360" ry="24" fill="none" stroke="url(#dopplerAccretion)" stroke-width="22" opacity="0.40" filter="url(#plasmaGlow)"/><ellipse cx="-10" cy="0" rx="340" ry="19" fill="none" stroke="url(#dopplerAccretion)" stroke-width="7" opacity="0.88" filter="url(#photonShimmer)"><animate attributeName="opacity" values="0.82;0.96;0.82" dur="4.8s" repeatCount="indefinite"/></ellipse><ellipse cx="-5" cy="0" rx="310" ry="15" fill="none" stroke="url(#hotCoreGrad)" stroke-width="3.2" opacity="0.95" filter="url(#photonShimmer)"/><ellipse cx="0" cy="0" rx="275" ry="12" fill="none" stroke="#fffdf7" stroke-width="1.4" opacity="0.85"/><ellipse cx="0" cy="0" rx="230" ry="10" fill="none" stroke="#f3c759" stroke-width="1.1" stroke-dasharray="80 20 40 30" opacity="0.65"><animate attributeName="stroke-dashoffset" values="0;340" dur="16s" repeatCount="indefinite"/></ellipse><ellipse cx="0" cy="0" rx="180" ry="8" fill="none" stroke="#fff7e8" stroke-width="0.9" stroke-dasharray="50 30 60 20" opacity="0.55"><animate attributeName="stroke-dashoffset" values="0;320" dur="11s" repeatCount="indefinite"/></ellipse></g>
    <g><animateMotion dur="13s" repeatCount="indefinite" path="M 330 0 A 330 19 0 1 1 -330 0 A 330 19 0 1 1 330 0"/><circle r="4.6" fill="#080b12"/><circle r="4.6" fill="none" stroke="#fff7e8" stroke-width="0.9" opacity="0.95" filter="url(#photonShimmer)"/></g>
    <circle r="2.5" fill="#fffdf7" filter="url(#photonShimmer)"><animateMotion dur="7.5s" repeatCount="indefinite" path="M -290 0 A 290 17 0 1 1 290 0 A 290 17 0 1 1 -290 0"/></circle><circle r="1.8" fill="#f3c759" filter="url(#photonShimmer)"><animateMotion dur="10s" repeatCount="indefinite" path="M 240 0 A 240 13 0 1 1 -240 0 A 240 13 0 1 1 240 0"/></circle>
  </g>
  <g text-anchor="middle" id="title-group"><text x="600" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Fira Code', sans-serif" font-size="34" font-weight="800" fill="#e8e2d8" letter-spacing="6" filter="url(#textSpecular)">SHRESHTHA JAGDAMBE<animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/></text><line x1="430" y1="65" x2="770" y2="65" stroke="url(#telemetryGrad)" stroke-width="1.2"><animate attributeName="opacity" values="0;1" dur="2.5s" fill="freeze"/></line><circle cx="600" cy="65" r="2.2" fill="#fff7e8" filter="url(#photonShimmer)"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle><text x="600" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="13" font-weight="500" fill="#8b9bb4" letter-spacing="3.5">Building something meaningful, one project at a time<animate attributeName="opacity" values="0;0;0.92" dur="3.2s" fill="freeze"/></text></g>
</svg>
