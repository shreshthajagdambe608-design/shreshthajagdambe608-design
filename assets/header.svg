<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
   
    <radialGradient id="spaceVoid" cx="72%" cy="48%" r="85%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="28%" stop-color="#070a12"/>
      <stop offset="60%" stop-color="#030408"/>
      <stop offset="100%" stop-color="#010203"/>
    </radialGradient>

    
    <radialGradient id="systemHaze" cx="73%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#ff9d33" stop-opacity="0.25"/>
      <stop offset="25%" stop-color="#cf5a13" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#5a1c04" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

   
    <radialGradient id="coronaBloom" cx="0" cy="0" r="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="15%" stop-color="#ffe8b8" stop-opacity="0.88"/>
      <stop offset="32%" stop-color="#fca834" stop-opacity="0.65"/>
      <stop offset="58%" stop-color="#c94e0a" stop-opacity="0.28"/>
      <stop offset="85%" stop-color="#5e1a03" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    
    <linearGradient id="upperArchGrad" x1="-150" y1="0" x2="100" y2="-120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff9924" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#fff9ee" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffbf52" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#d95a14" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#6e1c02" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="upperArchCaustic" x1="-120" y1="0" x2="80" y2="-100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="65%" stop-color="#ffe4a3" stop-opacity="0.92"/>
      <stop offset="90%" stop-color="#e36316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#732004" stop-opacity="0"/>
    </linearGradient>

    
    <linearGradient id="lowerArchGrad" x1="-50" y1="20" x2="120" y2="80" gradientUnits="userSpaceOnUse">
