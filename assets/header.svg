<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <radialGradient id="void" cx="50%" cy="58%" r="75%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#05070f"/>
      <stop offset="100%" stop-color="#010206"/>
    </radialGradient>
    <linearGradient id="diskBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e8b923" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#ffcf4f" stop-opacity="0.55"/>
      <stop offset="52%"  stop-color="#ffd76b" stop-opacity="0.75"/>
      <stop offset="72%"  stop-color="#e8912a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8b923" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="diskFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e8b923" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#e8912a" stop-opacity="0.9"/>
      <stop offset="47%"  stop-color="#fff3c4" stop-opacity="1"/>
      <stop offset="82%"  stop-color="#ffd76b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8b923" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreShadow" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="75%" stop-color="#010206"/>
      <stop offset="100%" stop-color="#080b16"/>
    </radialGradient>
    <radialGradient id="ringLensing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity="0"/>
      <stop offset="62%" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8b923" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="diskRearClip">
      <rect x="-280" y="-58" width="560" height="58"/>
    </clipPath>
    <clipPath id="diskFrontClip">
      <rect x="-280" y="0" width="560" height="72"/>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="240" fill="url(#void)"/>

  <!-- drifting starfield -->
  <g fill="#ffffff">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -60 0; 0 0" dur="60s" repeatCount="indefinite"/>
      <circle cx="80"   cy="40"  r="1.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="210"  cy="180" r="0.9"><animate attributeName="opacity" values="1;0.2;1"   dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="340"  cy="70"  r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="455"  cy="205" r="0.8"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="620"  cy="30"  r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="760"  cy="150" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="4.9s" repeatCount="indefinite"/></circle>
      <circle cx="905"  cy="55"  r="0.9"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="195" r="1.2"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="6.1s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="95"  r="1.0"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="150"  cy="120" r="0.7" opacity="0.5"/>
      <circle cx="520"  cy="115" r="0.6" opacity="0.4"/>
      <circle cx="840"  cy="215" r="0.7" opacity="0.5"/>
      <circle cx="990"  cy="130" r="0.6" opacity="0.45"/>
    </g>
  </g>

  <!-- lensed accretion disk -->
  <g transform="translate(600 130)">
    <ellipse rx="250" ry="34" fill="none" stroke="url(#diskBack)" stroke-width="22" opacity="0.26" filter="url(#soft)"/>
    <g clip-path="url(#diskRearClip)">
      <ellipse rx="248" ry="34" fill="none" stroke="url(#diskBack)" stroke-width="13" filter="url(#glow)">
        <animate attributeName="opacity" values="0.58;0.8;0.58" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="208" ry="23" fill="none" stroke="url(#diskBack)" stroke-width="4.6" opacity="0.68"/>
    </g>
    <ellipse rx="95" ry="18" fill="none" stroke="url(#ringLensing)" stroke-width="2.8" opacity="0.82" filter="url(#glow)">
      <animate attributeName="opacity" values="0.45;0.95;0.45" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <!-- event horizon -->
    <circle r="83" fill="url(#coreShadow)" filter="url(#soft)" opacity="0.62"/>
    <circle r="75" fill="#000000"/>
    <circle r="78" fill="none" stroke="#ffd76b" stroke-width="1.1" opacity="0.35"/>
    <g clip-path="url(#diskFrontClip)">
      <ellipse rx="248" ry="34" fill="none" stroke="url(#diskFront)" stroke-width="14" filter="url(#glow)">
        <animate attributeName="opacity" values="0.82;1;0.82" dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M -168 13 C -90 30 90 30 168 13" fill="none" stroke="#fff3c4" stroke-width="3.2" stroke-linecap="round" opacity="0.52"/>
    </g>
    <!-- orbiting photon -->
    <circle r="2.2" fill="#fff3c4" filter="url(#glow)">
      <animateMotion dur="9.5s" repeatCount="indefinite"
        path="M 248 0 A 248 34 0 1 1 -248 0 A 248 34 0 1 1 248 0"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="9.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Fira Code, Consolas, monospace" text-anchor="middle">
    <text x="600" y="72" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="3" filter="url(#glow)">
      SHRESHTHA JAGDAMBE
      <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
    </text>
    <text x="600" y="216" font-size="14" fill="#9fb3d1" letter-spacing="2">
      Building something meaningful, one project at a time
      <animate attributeName="opacity" values="0;0;0.9" dur="3.4s" fill="freeze"/>
    </text>
  </g>
</svg>
