<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <radialGradient id="voidGrad" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#121724"/>
      <stop offset="30%" stop-color="#0b0e18"/>
      <stop offset="65%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#010204"/>
    </radialGradient>
    <radialGradient id="nebulaHaze" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#9f7670" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#c79f5e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dopplerAccretion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c79f5e" stop-opacity="0"/>
      <stop offset="15%" stop-color="#e29538" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#f3c759" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fff7e8" stop-opacity="1"/>
      <stop offset="68%" stop-color="#e29538" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#a66e4a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8c5845" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="upperHaloGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c79f5e" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#f3c759" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#fff7e8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fffaee" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="lowerHaloGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3c759" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#c79f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9f7670" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hotCoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3c759" stop-opacity="0"/>
      <stop offset="25%" stop-color="#f3c759" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#fffdf7" stop-opacity="1"/>
      <stop offset="60%" stop-color="#fff7e8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#e29538" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c79f5e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="telemetryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3c759" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c79f5e" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#fff7e8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#c79f5e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f3c759" stop-opacity="0"/>
    </linearGradient>
    <filter id="coronaGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16" result="blur1"/><feGaussianBlur stdDeviation="28" result="blur2"/><feMerge><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="plasmaGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="photonShimmer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="sharpBlur"/><feMerge><feMergeNode in="sharpBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="textSpecular" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="tBlur"/><feMerge><feMergeNode in="tBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="280" fill="url(#voidGrad)"/>
  <rect width="1200" height="280" fill="url(#nebulaHaze)"/>
