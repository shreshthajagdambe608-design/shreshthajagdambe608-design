<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <radialGradient id="voidGrad" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#121724"/>
      <stop offset="30%" stop-color="#0b0e18"/>
      <stop offset="65%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#010204"/>
    </radialGradient>
    <radialGradient id="nebulaHaze" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#9f7670" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#c79f5e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="telemetryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c79f5e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c79f5e" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#fff7e8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#c79f5e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c79f5e" stop-opacity="0"/>
    </linearGradient>
    <filter id="textSpectular" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="tBlur"/>
      <feMerge>
        <feMergeNode in="tBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#voidGrad)"/>
  <rect width="1200" height="280" fill="url(#nebulaHaze)"/>

  <g fill="#ffffff">
    <circle cx="65" cy="42" r="0.8" opacity="0.4"/>
    <circle cx="140" cy="195" r="1.1" opacity="0.6"/>
    <circle cx="215" cy="68" r="0.7" opacity="0.3"/>
    <circle cx="280" cy="225" r="1.3" opacity="0.7"/>
    <circle cx="360" cy="38" r="0.9" opacity="0.5"/>
    <circle cx="430" cy="248" r="0.7" opacity="0.4"/>
    <circle cx="510" cy="28" r="1.2" opacity="0.6"/>
    <circle cx="690" cy="22" r="1.0" opacity="0.5"/>
    <circle cx="775" cy="254" r="0.8" opacity="0.4"/>
    <circle cx="850" cy="48" r="1.2" opacity="0.7"/>
    <circle cx="935" cy="210" r="0.7" opacity="0.3"/>
    <circle cx="1015" cy="72" r="1.4" opacity="0.8"/>
    <circle cx="1090" cy="188" r="0.9" opacity="0.5"/>
    <circle cx="1045" cy="135" r="1.1" opacity="0.7"/>
  </g>

  <g transform="translate(600,155)">
    <ellipse cx="0" cy="0" rx="280" ry="40" fill="none" stroke="url(#telemetryGrad)" stroke-width="26" opacity="0.35" filter="url(#textSpectular)"/>
    <ellipse cx="0" cy="0" rx="160" ry="20" fill="none" stroke="url(#telemetryGrad)" stroke-width="12" opacity="0.8"/>
    <circle cx="0" cy="0" r="58" fill="#010204"/>
    <circle cx="0" cy="0" r="59.5" fill="none" stroke="#fff7e8" stroke-width="2.2" opacity="0.95"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#f3c759" stroke-width="1.2" opacity="0.6"/>
  </g>

  <g text-anchor="middle">
    <text x="600" y="52"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Fira Code', sans-serif"
      font-size="34" font-weight="800" fill="#e8e2d8" letter-spacing="6" filter="url(#textSpectular)">SHRESHTHA JAGDAMBE</text>
    <line x1="430" y1="65" x2="770" y2="65" stroke="url(#telemetryGrad)" stroke-width="1.2"/>
    <circle cx="600" cy="65" r="2.2" fill="#fff7e8"/>
  </g>
</svg>
