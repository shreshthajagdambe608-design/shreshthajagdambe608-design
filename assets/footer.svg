<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fvoid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010206"/>
      <stop offset="60%" stop-color="#05070f"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e8b923" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#ffd76b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8912a" stop-opacity="0"/>
    </linearGradient>
    <filter id="fglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="140" fill="url(#fvoid)"/>

  <g fill="#ffffff">
    <circle cx="120"  cy="34" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2"   dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="300"  cy="62" r="0.8"><animate attributeName="opacity" values="1;0.15;1"    dur="5.6s" repeatCount="indefinite"/></circle>
    <circle cx="540"  cy="28" r="1.2"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="780"  cy="55" r="0.9"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="32" r="1.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="6.3s" repeatCount="indefinite"/></circle>
    <circle cx="200"  cy="88" r="0.6" opacity="0.4"/>
    <circle cx="660"  cy="80" r="0.6" opacity="0.45"/>
    <circle cx="920"  cy="90" r="0.7" opacity="0.4"/>
  </g>

  <!-- distant black-hole limb rising from the bottom -->
  <g transform="translate(600 300)">
    <circle r="205" fill="#04060d"/>
    <circle cx="0" cy="-98" r="54" fill="#010206"/>
    <ellipse cx="0" cy="-100" rx="104" ry="18" fill="none" stroke="url(#rim)" stroke-width="3.2" opacity="0.7" filter="url(#fglow)">
      <animate attributeName="opacity" values="0.45;0.9;0.45" dur="7.2s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="205" fill="none" stroke="url(#rim)" stroke-width="2.5" opacity="0.65" filter="url(#fglow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- craft on approach -->
  <circle r="2" fill="#fff3c4" filter="url(#fglow)">
    <animateMotion dur="14s" repeatCount="indefinite"
      path="M -30 20 Q 600 -10 1230 46"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="14s" repeatCount="indefinite"/>
  </circle>
</svg>
